<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <title>Frontend Mentor | Blog preview card</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <div class="card">
      <img src="illustration-article.svg" alt="HTML and CSS article" class="pic">

        <button>Learning</button>
      </div>
      <div class="main">
        <p class="date">21 dec 2023</p>
        <h3>HTML & CSS Foundations</h3>
        <p>These languages are the backbone of every website, defining struture , content, and presentation.</p>
      </div>
      <div class="author">
        <img src="image-avatar.webp" alt="Greg Hooper">
        <p>Greg Hooper</p>
      </div>

      <footer class="attribution">
        Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
        Coded by <a href="#">Razia Bano</a>.
      </footer>
    </div>
  </div>

</html>
